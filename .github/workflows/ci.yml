# Checks every branch and pull request before it reaches main (pages.yml
# deploys main): types, unit tests, then the browser smoke test
# (tools/smoke.mjs) on desktop and the iPhone profile. A pushed branch that
# passes then gets a preview at deeek.org/signoff/preview/<branch>/.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Playwright isn't a game dependency: fetched for this job only.
      - run: npx -y -p playwright@1.63.0 sh -c 'playwright install --with-deps chromium && node tools/smoke.mjs'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-out
          if-no-files-found: ignore

  # Rebuild the site with this branch's preview: pages.yml runs on main
  # (Pages deploys only from main) and builds every unmerged branch.
  preview:
    needs: [test, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
